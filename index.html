<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Собери карту</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e0f2fe;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        h1 {
            margin-bottom: 5px;
            font-size: clamp(1.2em, 4vw, 2em);
            text-align: center;
            color: #0f172a;
        }

        #info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            color: #475569;
            font-size: clamp(0.8em, 2.5vw, 1em);
            text-align: center;
        }

        p {
            color: #475569;
        }

        #puzzle-container {
            position: relative;
            width: min(90vw, 760px);
            aspect-ratio: 1166 / 768;
            max-width: 760px;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
        }

        #puzzle-container.solved {
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.9), 0 0 25px rgba(250, 204, 21, 0.95), 0 0 55px rgba(52, 211, 153, 0.8);
            animation: glowPulse 1.1s ease-in-out infinite alternate;
        }

        #confetti-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
        }

        .confetti {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 16px;
            border-radius: 2px;
            opacity: 0.9;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translate3d(0, -10px, 0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate3d(var(--drift, 0px), 105vh, 0) rotate(540deg);
                opacity: 0;
            }
        }

        @keyframes glowPulse {
            from {
                box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.9), 0 0 18px rgba(250, 204, 21, 0.9), 0 0 42px rgba(52, 211, 153, 0.5);
            }
            to {
                box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.95), 0 0 26px rgba(250, 204, 21, 1), 0 0 70px rgba(52, 211, 153, 0.9);
            }
        }

        #guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.25;
            pointer-events: none;
            user-select: none;
        }

        #puzzle-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
        }

        .puzzle-piece {
            width: 100%;
            height: 100%;
            background-image: url('map.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: outline 0.2s ease;
            user-select: none;
            touch-action: manipulation;
        }

        .puzzle-piece.selected {
            outline: 3px solid #ffd700;
            outline-offset: -3px;
            z-index: 10;
        }

        #win-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #win-message.show {
            display: flex;
        }

        #win-message h2 {
            font-size: clamp(2em, 8vw, 3em);
            color: #4ade80;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        #reset-btn {
            padding: 12px 30px;
            font-size: clamp(1em, 4vw, 1.2em);
            background: #4ade80;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #reset-btn:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <h1>Собери карту</h1>
    <div id="info-bar">
        <p>Нажми на кусок пазла, а затем на то место, куда он должен встать.</p>
        <p>Время: <span id="timer">0</span> сек</p>
    </div>
    
    <div id="puzzle-container" class="puzzle-shell">
        <div id="confetti-layer" aria-hidden="true"></div>
        <img id="guide" src="map.png" alt="Puzzle guide">
        <div id="puzzle-board"></div>
        <div id="win-message">
            <h2>Победа!!!</h2>
            <button id="reset-btn" onclick="resetPuzzle()">Сможешь быстрее?</button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 3;
        
        const puzzleBoard = document.getElementById('puzzle-board');
        const winMessage = document.getElementById('win-message');
        const timerEl = document.getElementById('timer');
        
        let pieces = [];
        let selectedPiece = null;
        let seconds = 0;
        let timerInterval = null;
        let gameStarted = false;
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSwapSound() {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function playWinSound() {
            initAudio();
            const notes = [523, 659, 784, 1047];
            notes.forEach((freq, i) => {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                oscillator.start(audioCtx.currentTime + i * 0.15);
                oscillator.stop(audioCtx.currentTime + i * 0.15 + 0.3);
            });
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                seconds++;
                timerEl.textContent = seconds;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function launchConfetti() {
            const container = document.getElementById('confetti-layer');
            if (!container) return;

            container.innerHTML = '';
            const colors = ['#f97316', '#facc15', '#34d399', '#60a5fa', '#f472b6', '#a78bfa'];

            for (let i = 0; i < 90; i++) {
                const piece = document.createElement('span');
                piece.className = 'confetti';
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.setProperty('--drift', `${(Math.random() * 220 - 110).toFixed(0)}px`);
                piece.style.animationDelay = `${(Math.random() * 0.7).toFixed(2)}s`;
                piece.style.animationDuration = `${(2.5 + Math.random() * 1.5).toFixed(2)}s`;
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(piece);
            }
        }

        function initPuzzle() {
            puzzleBoard.innerHTML = '';
            pieces = [];
            selectedPiece = null;
            winMessage.classList.remove('show');
            document.getElementById('puzzle-container').classList.remove('solved');
            document.getElementById('confetti-layer').innerHTML = '';
            seconds = 0;
            timerEl.textContent = 0;
            gameStarted = false;
            stopTimer();
            
            const container = document.getElementById('puzzle-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.dataset.correctRow = row;
                    piece.dataset.correctCol = col;
                    
                    piece.style.backgroundSize = `${width}px ${height}px`;
                    piece.style.backgroundPosition = `-${(col * width) / GRID_SIZE}px -${(row * height) / GRID_SIZE}px`;
                    
                    piece.addEventListener('click', handlePieceClick);
                    pieces.push(piece);
                }
            }
            
            shufflePieces();
            
            pieces.forEach(piece => {
                puzzleBoard.appendChild(piece);
            });
        }
        
        function shufflePieces() {
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
        }
        
        function handlePieceClick(e) {
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }
            initAudio();
            const clickedPiece = e.currentTarget;
            if (selectedPiece === null) {
                selectedPiece = clickedPiece;
                clickedPiece.classList.add('selected');
            } else if (selectedPiece === clickedPiece) {
                selectedPiece.classList.remove('selected');
                selectedPiece = null;
            } else {
                swapElements(selectedPiece, clickedPiece);
                playSwapSound();
                selectedPiece.classList.remove('selected');
                selectedPiece = null;
                checkWin();
            }
        }
        
        function swapElements(piece1, piece2) {
            const parent = puzzleBoard;
            const temp = document.createElement('div');
            parent.insertBefore(temp, piece1);
            parent.insertBefore(piece1, piece2);
            parent.insertBefore(piece2, temp);
            parent.removeChild(temp);
        }
        
        function checkWin() {
            const currentPieces = Array.from(puzzleBoard.children);
            let isWin = true;
            
            currentPieces.forEach((piece, index) => {
                const expectedRow = Math.floor(index / GRID_SIZE);
                const expectedCol = index % GRID_SIZE;
                const correctRow = parseInt(piece.dataset.correctRow);
                const correctCol = parseInt(piece.dataset.correctCol);
                
                if (correctRow !== expectedRow || correctCol !== expectedCol) {
                    isWin = false;
                }
            });
            
            if (isWin) {
                stopTimer();
                setTimeout(() => {
                    playWinSound();
                    launchConfetti();
                    document.getElementById('puzzle-container').classList.add('solved');
                    winMessage.classList.add('show');
                }, 300);
            }
        }
        
        function resetPuzzle() {
            initPuzzle();
        }
        
        initPuzzle();
    </script>
</body>
</html>
